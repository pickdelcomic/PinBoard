<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pickdel Board</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- TOP TOOLBAR -->

    <div id="toolbar">

        <button id="selectButton">
            SELECT
        </button>

        <button id="textButton">
            TEXT
        </button>

        <button id="imageButton">
            IMAGE
        </button>

        <button id="stickerButton">
            STICKER
        </button>

        <button id="pageButton">
            PAGE
        </button>

        <button id="drawButton">
            DRAW
        </button>

        <button id="eraserButton">
            ERASER
        </button>

        <div class="toolbar-divider"></div>

        <button id="newButton">
            NEW
        </button>

        <button id="saveButton">
            SAVE
        </button>

        <button id="saveAsButton">
            SAVE AS
        </button>

        <button id="folderButton">
            FOLDER
        </button>

        <button id="loadButton">
            LOAD
        </button>

        <div class="toolbar-divider"></div>

        <label class="tool-label">
            PEN
            <input
                type="color"
                id="penColor"
                value="#000000"
            >
        </label>

        <label class="tool-label">
            SIZE
            <input
                type="number"
                id="penSize"
                value="4"
                min="1"
                max="50"
            >
        </label>

        <label class="tool-label">
            BG
            <input
                type="color"
                id="backgroundColor"
                value="#ffffff"
            >
        </label>

        <div class="toolbar-spacer"></div>

        <button
            id="backButton"
            style="display:none"
        >
            BACK
        </button>

        <div id="pickdel">
            PICKDEL
        </div>

        <span id="zoomDisplay">
            100%
        </span>

    </div>


    <!-- BOARD -->

    <div id="board">

        <div id="workspace"></div>

        <canvas id="drawingCanvas"></canvas>

    </div>


    <!-- IMAGE INPUT -->

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >


    <!-- BOARD INPUT -->

    <input
        type="file"
        id="boardInput"
        accept=".json"
        hidden
    >


    <!-- RIGHT CLICK MENU -->

    <div id="contextMenu">

        <button id="deleteObject">
            Delete
        </button>

        <button id="duplicateObject">
            Duplicate
        </button>

        <button id="openPage">
            Open Page
        </button>

    </div>


    <script src="app.js"></script>

</body>

</html>
