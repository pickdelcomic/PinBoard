<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Board</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- TOOLBAR -->

    <div id="toolbar">

        <button id="selectButton">
            SELECT
        </button>

        <button id="textButton">
            TEXT
        </button>

        <button id="imageButton">
            IMAGE
        </button>

        <button id="stickerButton">
            STICKER
        </button>

        <button id="penButton">
            PEN
        </button>

        <button id="lineButton">
            LINE
        </button>

        <button id="eraserButton">
            ERASER
        </button>

        <div class="toolbar-divider"></div>

        <button id="saveButton">
            SAVE
        </button>

        <button id="loadButton">
            LOAD
        </button>

        <div class="toolbar-spacer"></div>

        <span id="zoomDisplay">
            100%
        </span>

    </div>


    <!-- BOARD -->

    <div id="board">

        <div id="workspace"></div>

    </div>


    <!-- IMAGE FILE INPUT -->

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >


    <!-- BOARD FILE INPUT -->

    <input
        type="file"
        id="boardInput"
        accept=".json"
        hidden
    >


    <!-- RIGHT CLICK MENU -->

    <div id="contextMenu">

        <button id="deleteObject">
            Delete
        </button>

        <button id="duplicateObject">
            Duplicate
        </button>

    </div>


    <script src="app.js"></script>

</body>

</html>
