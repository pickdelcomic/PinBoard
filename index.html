<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="board">
        <div class="note" style="left: 150px; top: 120px;">
            <div class="note-title">My First Note</div>
            <div class="note-content">
                Hello! This is my board.
            </div>
        </div>
    </div>

    <div id="toolbar">
        <button>SELECT</button>
        <button>TEXT</button>
        <button>IMAGE</button>
        <button>PEN</button>
        <button>LINE</button>
        <button>ERASER</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
