<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pickdel Board</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         TOOLBAR
    ========================== -->

    <div id="toolbar">

        <button id="selectButton">
            SELECT
        </button>

        <button id="textButton">
            TEXT
        </button>

        <button id="imageButton">
            IMAGE
        </button>

        <button id="stickerButton">
            STICKER
        </button>

        <button id="drawButton">
            DRAW
        </button>

        <button id="eraserButton">
            ERASER
        </button>

        <button id="pageButton">
            PAGE
        </button>

        <div class="toolbar-divider"></div>

        <label class="color-control">

            PEN

            <input
                type="color"
                id="penColor"
                value="#000000"
            >

        </label>


        <label class="color-control">

            BG

            <input
                type="color"
                id="backgroundColor"
                value="#ffffff"
            >

        </label>


        <div class="toolbar-divider"></div>

        <button id="newButton">
            NEW
        </button>

        <button id="saveButton">
            SAVE
        </button>

        <button id="saveAsButton">
            SAVE AS
        </button>

        <button id="loadButton">
            LOAD
        </button>


        <div class="toolbar-spacer"></div>


        <div id="pickdel">
            PICKDEL
        </div>


        <span id="zoomDisplay">
            100%
        </span>

    </div>



    <!-- =========================
         BOARD
    ========================== -->

    <div id="board">

        <div id="workspace"></div>

        <canvas
            id="drawingCanvas"
        ></canvas>

    </div>



    <!-- IMAGE INPUT -->

    <input
        type="file"
        id="imageInput"
        accept="image/*"
        hidden
    >


    <!-- BOARD LOAD INPUT -->

    <input
        type="file"
        id="boardInput"
        accept=".json"
        hidden
    >



    <!-- =========================
         RIGHT CLICK MENU
    ========================== -->

    <div id="contextMenu">

        <button id="deleteObject">
            Delete
        </button>

        <button id="duplicateObject">
            Duplicate
        </button>

    </div>



    <!-- =========================
         PAGE DIALOG
    ========================== -->

    <div
        id="pageDialog"
        class="dialog"
    >

        <div class="dialog-box">

            <div class="dialog-title">
                CREATE PAGE
            </div>


            <div class="dialog-content">

                <p>
                    What should this page button look like?
                </p>


                <button id="pageTextOption">
                    TEXT
                </button>

                <button id="pageImageOption">
                    IMAGE
                </button>

                <button id="pageCancelOption">
                    CANCEL
                </button>

            </div>

        </div>

    </div>



    <script src="app.js"></script>

</body>

</html>
